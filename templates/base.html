<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Elephantry - When Rust meets PostgreSQL
            {% if page and page.title %}
                | {{ page.title }}
            {% endif %}
            {% if section and section.title %}
                | {{ section.title }}
            {% endif %}
        </title>
        <link rel="icon" type="image/png" href="/favicon.ico" sizes="32x32" />
        <link href="/lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="/site.css" />
    </head>
    <body>
        <nav class="navbar md:navbar-expand bg-1" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">Elephantry</a>

                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>

                <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body  mb-2 md:mb-0">
                        <ul class="nav navbar-nav me-auto">
                            <li class="nav-item">
                                <button class="nav-link" href="#" data-bs-toggle="menu" aria-expanded="false">Docs</button>

                                <div class="menu">
                                    {% set doc = get_section(path="documentation/_index.md") %}
                                    {% for page in doc.pages %}
                                        <a class="menu-item" href="{{ page.permalink }}">{{ page.title }}</a>
                                    {% endfor %}
                                </div>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link ext" target="_blank" href="https://docs.rs/elephantry/">API</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link ext" target="_blank" href="https://github.com/elephantry/elephantry">Code</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>

        <main role="main">
            {% block content %}{% endblock %}
        </main>

        <footer>
            <div class="container">
                <p>&copy; 2020 - 2022 <a href="https://github.com/orgs/elephantry/people">The elephantry team</a>.</p>
            </div>
        </footer>

        <script type="module">
            import { Drawer } from '/lib/bootstrap/dist/js/bootstrap.bundle.min.js'

            const drawerElementList = document.querySelectorAll('dialog.drawer')
            const drawerList = [...drawerElementList].map(drawerEl => new Drawer(drawerEl))
        </script>
    </body>
</html>
